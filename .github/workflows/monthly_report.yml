name: Monthly P&L Reports

on:
  schedule:
    # 10:00 AM PST (UTC-8) = 18:00 UTC on the 1st and 16th of every month
    # Note: fires at 11:00 AM during daylight saving time (PDT = UTC-7)
    - cron: "0 18 1,16 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (save HTML, skip email)"
        type: boolean
        default: false

concurrency:
  # Serialize every QBO-token-refreshing workflow onto one shared queue so no two
  # runs rotate the refresh token concurrently — a concurrent rotation strands the
  # whole token chain on invalid_grant and forces a full QBO re-bootstrap. Runs
  # queue instead of cancelling: each must finish its own token writeback.
  group: qbo-token-chain
  cancel-in-progress: false

permissions:
  # contents: write is needed to commit docs/incident-log.md back to the repo.
  # Deliberately the only elevated scope: everything else stays at the default.
  contents: write

jobs:
  send-report:
    runs-on: ubuntu-latest
    # Job-level env so both the pipeline step and the failure-notify step see
    # the SMTP/QBO secrets.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      QBO_CLIENT_ID:           ${{ secrets.QBO_CLIENT_ID }}
      QBO_CLIENT_SECRET:       ${{ secrets.QBO_CLIENT_SECRET }}
      QBO_REDIRECT_URI:        ${{ secrets.QBO_REDIRECT_URI }}
      QBO_REALM_ID:            ${{ secrets.QBO_REALM_ID }}
      QBO_ACCESS_TOKEN:        ${{ secrets.QBO_ACCESS_TOKEN }}
      QBO_REFRESH_TOKEN:       ${{ secrets.QBO_REFRESH_TOKEN }}
      QBO_TOKEN_EXPIRY:        ${{ secrets.QBO_TOKEN_EXPIRY }}
      QBO_ENVIRONMENT:         production
      GH_PAT:                  ${{ secrets.GH_PAT }}
      EMAIL_PROVIDER:          ${{ secrets.EMAIL_PROVIDER }}
      EMAIL_FROM:              ${{ secrets.EMAIL_FROM }}
      EMAIL_TO:                ${{ secrets.EMAIL_TO }}
      ALERT_EMAIL:             ${{ secrets.ALERT_EMAIL }}
      SMTP_HOST:               ${{ secrets.SMTP_HOST }}
      SMTP_PORT:               ${{ secrets.SMTP_PORT }}
      SMTP_USER:               ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD:           ${{ secrets.SMTP_PASSWORD }}
      SENDGRID_API_KEY:        ${{ secrets.SENDGRID_API_KEY }}
      COGS_VARIANCE_THRESHOLD: ${{ secrets.COGS_VARIANCE_THRESHOLD }}
      # Dead-man's-switch ping target (e.g. a healthchecks.io URL). Empty until the
      # secret is set → the heartbeat simply no-ops. Only the scheduled all-reports
      # workflow pings, so a missed cron is what the monitor detects.
      HEARTBEAT_URL:           ${{ secrets.HEARTBEAT_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: |
          # Scheduled runs respect each report's trigger_days (so the scorecard
          # stays 1st-only). Manual dispatches force-run all reports regardless
          # of the date for on-demand testing.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            FORCE=""
          else
            FORCE="--force"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python scheduler.py $FORCE --dry-run
          else
            python scheduler.py $FORCE
          fi

      - name: Upload previews (dry run only)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          # The multi-report scheduler writes preview_<slug>.html per report
          # (e.g. preview_cogs.html, preview_monthly_business_dashboard.html) —
          # never a single preview_report.html. Glob them all, and fail loudly
          # if a dry run produced nothing so the gap can't go silent again.
          name: preview-reports
          path: preview_*.html
          if-no-files-found: error
          retention-days: 3

      # Infra-level safety net: catches failures the Python process can't
      # self-report (process killed, dependency install failure). A failed token
      # writeback now fails the run from inside the process and sends its own
      # alert (SEC-2); Python-level failures likewise send a detailed in-process
      # alert, so this step may add a second, generic notification.
      - name: Notify on failure
        if: ${{ failure() && github.event.inputs.dry_run != 'true' }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import os
          from mailer import send_failure_alert
          send_failure_alert(
              "QBO Monthly Report workflow FAILED",
              "The scheduled QBO report workflow failed.\n\n"
              "Run: " + os.environ.get("RUN_URL", "") + "\n\n"
              "Check the Actions logs for details (token refresh, dependency "
              "install, or a killed process).",
          )
          PY

      # The incident log is the system's memory of its own failures, and the runner
      # is thrown away when the job ends. Commit it back so the record outlives both
      # the runner and the Actions log retention window. This runs on failure too —
      # a failed run is precisely the one worth recording. [skip ci] stops an
      # incident entry from re-triggering the test workflow.
      - name: Commit incident log
        if: always()
        run: |
          if [ -z "$(git status --porcelain docs/incident-log.md)" ]; then
            echo "No new incidents to record."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/incident-log.md
          git commit -m "Record run incidents in the incident log [skip ci]"
          # Another report workflow may have landed an entry while this one ran.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
               && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying."
            sleep 5
          done
          # Never mask the run's real outcome behind a bookkeeping failure. The
          # entry is still visible in this run's log output.
          echo "Could not push the incident log after 3 attempts."
          exit 0
